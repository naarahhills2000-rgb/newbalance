<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Balance - New Collection</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: #e8e8e8;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* Header / Logo */
    .header {
      text-align: center;
      margin-bottom: 60px;
    }

    .logo {
      width: 120px;
      height: auto;
    }

    /* Main Content */
    .main-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }

    /* Text Section */
    .text-section {
      flex: 1;
      max-width: 400px;
    }

    .label {
      font-size: 12px;
      letter-spacing: 2px;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .title {
      font-size: 48px;
      font-weight: 400;
      color: #1a1a1a;
      margin-bottom: 20px;
      line-height: 1.1;
    }

    .description {
      font-size: 14px;
      line-height: 1.6;
      color: #666;
    }

    /* Image Section */
    .image-section {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .shoe-image {
      max-width: 100%;
      width: 550px;
      height: auto;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.15));
    }

    /* Bottom Accent Line */
    .accent-line {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(
        to right,
        #e53935,
        #ff9800,
        #ffeb3b,
        #4caf50,
        #2196f3,
        #9c27b0
      );
    }

    /* Responsive */
    @media (max-width: 768px) {
      .main-content {
        flex-direction: column;
        text-align: center;
      }

      .text-section {
        max-width: 100%;
      }

      .title {
        font-size: 36px;
      }

      .shoe-image {
        width: 100%;
        max-width: 400px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header with Logo -->
    <header class="header">
      <img 
        src="./New_Balance_logo.png" 
        alt="New Balance Logo" 
        class="logo"
      >
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Text Section -->
      <div class="text-section">
        <p class="label">New Collection</p>
        <h1 class="title">New Balance</h1>
        <p class="description">
          From sports to running to work shoes and even sandals, 
          browse our women's active shoes below to find your ideal fit.
        </p>
      </div>

      <!-- Image Section -->
      <div class="image-section">
        <img 
          src="./shoe-1.png" 
          alt="New Balance 574 Sneakers" 
          class="shoe-image"
        >
      </div>
    </main>
  </div>

  <!-- Colorful Accent Line at Bottom -->
  <div class="accent-line"></div>
</body>
</html>
